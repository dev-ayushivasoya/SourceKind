<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · SourceKind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #10222b;
        --moss: #16393a;
        --amber: #f0b44c;
        --mist: #e6eef3;
        --blue: #2b55d9;
        --danger: #c0392b;
        --ok: #1e7f55;
        --head: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
        --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--body);
        color: var(--ink);
        background: var(--moss);
        -webkit-font-smoothing: antialiased;
      }
      .split {
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(24px, 5vw, 72px);
        transition: flex 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
        position: relative;
        min-width: 0;
      }
      .panel.active {
        flex: 1.5;
      }
      .maintainer {
        background: var(--moss);
        color: #f2f6f4;
        --fg: #f2f6f4;
        --muted: #a9c0bb;
        --line: #3b5c5b;
        --field: #1d4748;
        --accent: var(--amber);
        --on-accent: #1b1405;
      }
      .contributor {
        background: var(--mist);
        color: var(--ink);
        --fg: var(--ink);
        --muted: #4d6470;
        --line: #b9c9d3;
        --field: #fff;
        --accent: var(--blue);
        --on-accent: #fff;
      }
      .brand {
        z-index: 2;
        position: absolute;
        top: clamp(20px, 3vw, 36px);
        left: clamp(24px, 5vw, 72px);
        font: 700 1.25rem var(--head);
        letter-spacing: -0.01em;
        text-decoration: none;
        color: inherit;
      }
      .inner {
        width: 100%;
        max-width: 420px;
        margin-inline: auto;
      }

      h2 {
        font: 700 clamp(2rem, 4vw, 3.1rem)/1.02 var(--head);
        letter-spacing: -0.025em;
        margin-bottom: 12px;
      }
      .blurb {
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 28px;
        max-width: 34ch;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 22px;
      }
      .tab {
        background: none;
        border: 0;
        color: var(--muted);
        font: 600 0.95rem var(--body);
        padding: 10px 14px;
        margin-bottom: -1px;
        border-bottom: 2px solid transparent;
        cursor: pointer;
      }
      .tab[aria-selected="true"] {
        color: var(--fg);
        border-color: var(--accent);
      }
      form {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 0.88rem;
        font-weight: 500;
      }
      .field-wrap {
        position: relative;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        font: inherit;
        font-size: 1rem;
        color: var(--fg);
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
      }
      input::placeholder {
        color: var(--muted);
        opacity: 0.7;
      }
      input[aria-invalid="true"] {
        border-color: var(--danger);
      }
      .toggle-pw {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: 0;
        color: var(--muted);
        font: 500 0.82rem var(--body);
        padding: 8px;
        cursor: pointer;
        border-radius: 6px;
      }
      .err {
        color: #e0604f;
        font-size: 0.82rem;
        min-height: 0;
      }
      .contributor .err {
        color: var(--danger);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.88rem;
        gap: 12px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 400;
      }
      .check input {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
      }
      a.link,
      button.link {
        color: var(--fg);
        background: none;
        border: 0;
        font: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
        padding: 0;
      }
      .btn {
        font: 600 1rem var(--body);
        border-radius: 8px;
        padding: 13px 16px;
        cursor: pointer;
        border: 1px solid transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
      }
      .btn.primary {
        background: var(--accent);
        color: var(--on-accent);
      }
      .btn.primary[disabled] {
        opacity: 0.6;
        cursor: progress;
      }
      .btn.ghost {
        background: transparent;
        color: var(--fg);
        border-color: var(--line);
      }
      .btn svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .status {
        font-size: 0.9rem;
        padding: 10px 12px;
        border-radius: 8px;
        display: none;
      }
      .status.show {
        display: block;
        background: rgba(30, 127, 85, 0.14);
        color: var(--ok);
      }
      .maintainer .status.show {
        color: #8fe0b8;
      }
      .teaser {
        display: grid;
        gap: 14px;
        max-width: 300px;
      }
      .teaser .btn {
        width: auto;
        justify-self: start;
      }
      .fine {
        margin-top: 22px;
        font-size: 0.78rem;
        color: var(--muted);
        line-height: 1.5;
      }
      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .contributor input:focus-visible {
        outline-color: var(--blue);
      }
      @media (max-width: 820px) {
        .split {
          flex-direction: column;
        }
        .panel {
          flex: none;
          justify-content: flex-start;
          padding-top: 72px;
        }
        .panel.active {
          flex: 1;
        }
        .panel:not(.active) {
          padding-top: 28px;
          padding-bottom: 28px;
        }
        .panel:not(.active) .blurb {
          display: none;
        }
        .panel:not(.active) h2 {
          font-size: 1.5rem;
        }
        .brand {
          display: none;
        }
        .maintainer.active .inner,
        .contributor.active .inner {
          margin-inline: auto;
        }
        .maintainer {
          order: 1;
        }
        .contributor {
          order: 2;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .panel {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="split" id="split">
      <a class="brand" href="/" style="color: #f2f6f4">SourceKind</a>
      <section
        class="panel maintainer"
        id="p-maintainer"
        aria-labelledby="h-maintainer"
      ></section>
      <section
        class="panel contributor"
        id="p-contributor"
        aria-labelledby="h-contributor"
      ></section>
    </main>

    <script>
      /* ---------- Config: point these at your backend ---------- */
      const API = {
        // POST { role, mode, ...fields } -> 2xx on success, { message } on failure
        submit: (role, mode) => `/api/auth/${role}/${mode}`,
        github: (role) => `/auth/login/github?role=${role}`,
        forgot: "/auth/login/recover",
        // Where to send people after signing in
        redirect: { maintainer: "/", contributor: "/" },
      };

      const COPY = {
        maintainer: {
          title: "Maintainers",
          blurb:
            "Review pull requests, triage issues and welcome new contributors to your projects.",
          teaser: "Run a project?",
          switchLabel: "Switch to maintainer",
          extra: {
            name: "org",
            label: "Organization or project",
            ph: "acme-labs",
          },
        },
        contributor: {
          title: "Contributors",
          blurb:
            "Find projects that need you, pick up beginner-friendly issues and keep track of your contributions.",
          teaser: "Here to contribute?",
          switchLabel: "Switch to contributor",
          extra: { name: "handle", label: "GitHub username", ph: "octocat" },
        },
      };

      const GH_ICON =
        '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.71 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.19c0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>';

      const state = {
        active: "contributor",
        mode: { maintainer: "signin", contributor: "signin" },
      };

      function esc(s) {
        return s.replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      function field(id, label, type, ph, autocomplete) {
        return `<label for="${id}">${label}
    <span class="field-wrap">
      <input id="${id}" name="${id}" type="${type}" placeholder="${esc(ph)}" autocomplete="${autocomplete}" aria-describedby="${id}-err">
      ${type === "password" ? '<button type="button" class="toggle-pw" aria-label="Show password" data-toggle>Show</button>' : ""}
    </span>
    <span class="err" id="${id}-err" role="alert"></span></label>`;
      }

      function formHTML(role) {
        if (role === "maintainer") {
          return `
         <button type="button" class="btn primary" data-github>${GH_ICON} Continue with GitHub</button>
         <p class="fine">Maintainers sign in with GitHub so we can verify who you are before any money is released to you. Signing in for the first time creates your maintainer account.</p>`;
        }
        const c = COPY[role],
          mode = state.mode[role],
          signup = mode === "signup";
        return `
    <div class="tabs" role="tablist" aria-label="${c.title} account">
      <button class="tab" role="tab" aria-selected="${!signup}" data-mode="signin">Sign in</button>
      <button class="tab" role="tab" aria-selected="${signup}" data-mode="signup">Create account</button>
    </div>
    <button type="button" class="btn ghost" data-github>${GH_ICON} Continue with GitHub</button>
    <div class="divider" style="margin:16px 0">or use email</div>
    <form novalidate data-role="${role}">
      ${signup ? field(`${role}-name`, "Full name", "text", "Ada Lovelace", "name") : ""}
      ${signup ? field(`${role}-${c.extra.name}`, c.extra.label, "text", c.extra.ph, "off") : ""}
      ${field(`${role}-email`, "Email", "email", "you@example.com", "email")}
      ${field(`${role}-password`, "Password", "password", signup ? "At least 8 characters" : "Your password", signup ? "new-password" : "current-password")}
      ${
        signup
          ? `<label class="check"><input type="checkbox" id="${role}-terms"> I agree to the terms and code of conduct</label><span class="err" id="${role}-terms-err" role="alert"></span>`
          : `<div class="row"><label class="check"><input type="checkbox" id="${role}-remember"> Keep me signed in</label><a class="link" href="${API.forgot}?role=${role}">Forgot password?</a></div>`
      }
      <div class="status" role="status" aria-live="polite"></div>
      <button class="btn primary" type="submit">${signup ? "Create " + role + " account" : "Sign in as " + role}</button>
    </form>
    <p class="fine">${
      role === "maintainer"
        ? "Maintainer accounts can manage repositories, roles and review queues."
        : "Contributor accounts can browse projects, claim issues and submit pull requests."
    }</p>`;
      }

      function teaserHTML(role) {
        const c = COPY[role];
        return `<div class="teaser"><p class="blurb" style="margin:0">${c.blurb}</p>
    <p style="font-weight:600">${c.teaser}</p>
    <button class="btn ghost" data-switch="${role}">${c.switchLabel}</button></div>`;
      }

      function render(focus) {
        for (const role of ["maintainer", "contributor"]) {
          const el = document.getElementById("p-" + role),
            c = COPY[role],
            on = state.active === role;
          el.classList.toggle("active", on);
          el.innerHTML = `<div class="inner"><h2 id="h-${role}">${c.title}</h2>${on ? `<p class="blurb">${c.blurb}</p>` + formHTML(role) : teaserHTML(role)}</div>`;
        }
        history.replaceState(null, "", "#" + state.active);
        if (focus) {
          const i = document.querySelector(
            ".panel.active input[type=text],.panel.active input[type=email]",
          );
          i && i.focus({ preventScroll: true });
        }
      }

      function setErr(input, msg) {
        const e = document.getElementById(input.id + "-err");
        if (e) e.textContent = msg || "";
        input.setAttribute("aria-invalid", msg ? "true" : "false");
        return !msg;
      }

      function validate(form, role, signup) {
        const g = (s) => form.querySelector("#" + role + "-" + s);
        let ok = true,
          first = null;
        const check = (el, msg) => {
          if (!setErr(el, msg)) {
            ok = false;
            first = first || el;
          }
        };
        if (signup) {
          check(
            g("name"),
            g("name").value.trim() ? "" : "Enter your full name.",
          );
          const x = g(COPY[role].extra.name);
          check(
            x,
            x.value.trim()
              ? ""
              : `Enter your ${COPY[role].extra.label.toLowerCase()}.`,
          );
        }
        check(
          g("email"),
          /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g("email").value.trim())
            ? ""
            : "Enter a valid email address.",
        );
        const pw = g("password").value;
        check(
          g("password"),
          !pw
            ? "Enter your password."
            : signup && pw.length < 8
              ? "Use at least 8 characters."
              : "",
        );
        if (signup && !g("terms").checked) {
          document.getElementById(role + "-terms-err").textContent =
            "Accept the terms to continue.";
          ok = false;
        } else if (signup)
          document.getElementById(role + "-terms-err").textContent = "";
        if (first) first.focus();
        return ok;
      }

      async function onSubmit(e) {
        e.preventDefault();
        const form = e.target,
          role = form.dataset.role,
          mode = state.mode[role],
          signup = mode === "signup";
        if (!validate(form, role, signup)) return;
        const btn = form.querySelector(".primary"),
          status = form.querySelector(".status"),
          label = btn.textContent;
        const data = Object.fromEntries(
          [...form.querySelectorAll("input")]
            .filter(
              (i) =>
                (i.type !== "checkbox" && i.type !== "password") ||
                i.type === "password",
            )
            .map((i) => [i.id.replace(role + "-", ""), i.value.trim()]),
        );
        btn.disabled = true;
        btn.textContent = signup ? "Creating account…" : "Signing in…";
        status.classList.remove("show");
        try {
          const res = await fetch(API.submit(role, mode), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ role, mode, ...data }),
          });
          if (!res.ok) {
            const j = await res.json().catch(() => ({}));
            throw new Error(j.message || "Something went wrong. Try again.");
          }
          status.textContent = signup
            ? "Account created. Redirecting…"
            : "Signed in. Redirecting…";
          status.classList.add("show");
          setTimeout(() => {
            window.location.href = API.redirect[role];
          }, 600);
        } catch (err) {
          // No backend yet? fetch fails with a network/404 error — show it in the form.
          const pw = form.querySelector("input[type=password]");
          setErr(pw, err.message);
          btn.disabled = false;
          btn.textContent = label;
        }
      }

      document.addEventListener("click", (e) => {
        const t = e.target.closest(
          "[data-switch],[data-mode],[data-toggle],[data-github]",
        );
        if (!t) return;
        if (t.dataset.switch) {
          state.active = t.dataset.switch;
          render(true);
        } else if (t.dataset.mode) {
          state.mode[state.active] = t.dataset.mode;
          render(true);
        } else if (t.hasAttribute("data-toggle")) {
          const i = t.previousElementSibling,
            show = i.type === "password";
          i.type = show ? "text" : "password";
          t.textContent = show ? "Hide" : "Show";
          t.setAttribute(
            "aria-label",
            show ? "Hide password" : "Show password",
          );
        } else if (t.hasAttribute("data-github"))
          window.location.href = API.github(state.active);
      });
      document.addEventListener("submit", (e) => {
        if (e.target.matches("form[data-role]")) onSubmit(e);
      });
      document.addEventListener("keydown", (e) => {
        const tab = e.target.closest && e.target.closest(".tab");
        if (tab && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
          state.mode[state.active] =
            state.mode[state.active] === "signin" ? "signup" : "signin";
          render();
          document
            .querySelector('.panel.active .tab[aria-selected="true"]')
            .focus();
        }
      });

      const h = location.hash.slice(1);
      if (h === "maintainer" || h === "contributor") state.active = h;
      render();
    </script>
  </body>
</html>
